name: Email Triage AI Agent

on:
  # Triggered manually via GitHub UI or programmatically via REST API.
  # Note: Scheduled execution (every 30 mins, Mon-Fri, 09:00-20:00 Asia/Tbilisi)
  # is handled by an external cron service (cron-job.org) via workflow_dispatch
  # to ensure exact execution timing without GitHub Actions queue delays.
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./email-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Email Triage Agent
        env:
          YANDEX_EMAIL: ${{ secrets.YANDEX_EMAIL }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PRIORITY_COLLEAGUES: ${{ secrets.PRIORITY_COLLEAGUES }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: python main.py
